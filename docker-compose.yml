services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me}
      - SQLALCHEMY_DATABASE_URI=${SQLALCHEMY_DATABASE_URI:-sqlite:////data/campus_assistant.db}
      - PYTHONUNBUFFERED=1
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./deploy-data/sqlite:/data
      - ./deploy-data/uploads:/app/backend/uploads/awards
      - ./deploy-data/org-logos:/app/backend/uploads/org-logos
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: campus_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

